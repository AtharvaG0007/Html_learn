<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb"><meta name="description" content="A simple personal finance and expense tracker.">
<title>Transactions | PocketTrack</title><link rel="stylesheet" href="css/style.css"></head><body><div class="container">
<header class="site-header"><div class="brand"><div class="logo" aria-hidden="true">₹</div><div><h1>PocketTrack</h1><p>Simple money management</p></div></div>
<nav class="nav" aria-label="Main navigation">
<a href="index.html" class="">Dashboard</a>
<a href="transactions.html" class="active">Transactions</a>
<a href="budget.html" class="">Budget</a>
<a href="reports.html" class="">Insights</a></nav></header>
<main><div class="page-heading"><h2>Transactions</h2><p>Add, find, edit and manage your income and expenses.</p></div>
<section class="panel"><h3 id="formTitle">Add a transaction</h3><form id="transactionForm">
<input type="hidden" id="editId"><div class="form-grid">
<div><label for="description">Description</label><input id="description" maxlength="70" placeholder="e.g. Grocery shopping" required></div>
<div><label for="amount">Amount (₹)</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 450" required></div>
<div><label for="type">Type</label><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select></div>
<div><label for="category">Category</label><select id="category"><option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Bills</option><option>Salary</option><option>Health</option><option>Entertainment</option><option>Other</option></select></div>
<div><label for="date">Date</label><input id="date" type="date" required></div>
<div><label for="payment">Payment method</label><select id="payment"><option>UPI</option><option>Cash</option><option>Debit Card</option><option>Credit Card</option><option>Bank Transfer</option><option>Other</option></select></div>
<div class="field-full"><label for="note">Note (optional)</label><textarea id="note" maxlength="180" placeholder="Add a short note"></textarea></div></div>
<div class="form-actions"><button class="button" type="submit" id="saveTransaction">Save transaction</button><button class="button secondary" type="button" id="cancelEdit" hidden>Cancel edit</button></div><p class="status" id="transactionFeedback" role="status" aria-live="polite"></p></form></section>
<section class="panel"><div class="panel-head"><h3>All transactions</h3><button class="button secondary small" id="exportCsv" type="button">Export CSV</button></div>
<div class="toolbar"><input id="searchTransactions" type="search" placeholder="Search description or category..." aria-label="Search transactions"><select id="filterType" aria-label="Filter by type"><option value="all">All types</option><option value="income">Income</option><option value="expense">Expense</option></select><select id="filterMonth" aria-label="Filter by month"><option value="all">All months</option></select></div>
<div id="transactionList"><p class="empty">No transactions yet.</p></div></section></main><footer class="site-footer">Designed &amp; Developed by <strong>SiteCrafters</strong> · Client Preview</footer></div><script src="js/app.js"></script></body></html>
